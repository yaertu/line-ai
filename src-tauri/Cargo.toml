[package]
name = "line-ai"
version = "0.3.0"
description = "OpenAI ve Gemini destekli Windows yapay zeka çalışma alanı"
authors = ["yaertu"]
edition = "2021"
default-run = "line-ai"

[lib]
name = "line_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
keyring = { version = "4.2.0", default-features = false, features = ["v1", "windows-native-keyring-store"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
