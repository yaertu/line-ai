[package]
name = "line-ai"
version = "0.2.0"
description = "OpenAI ve Gemini destekli yerel Windows yapay zeka çalışma alanı"
authors = ["yaertu"]
edition = "2021"
default-run = "line-ai"

[lib]
name = "line_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
