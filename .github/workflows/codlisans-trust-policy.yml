name: codlisans-trust-policy

on:
  push:
    branches: ["ci/codlisans-trust-policy"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: codlisans-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Select pinned Rust
        run: rustup override set 1.98.0
      - name: Toolchain evidence
        run: rustc --version && cargo --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clear Windows CryptNet URL cache
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = & certutil.exe -urlcache "*" delete 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }

          $errorNoMoreItems = -2147024637 # 0x80070103 / ERROR_NO_MORE_ITEMS
          if ($exitCode -ne 0 -and $exitCode -ne $errorNoMoreItems) {
            throw "certutil failed to clear the Windows CryptNet URL cache with exit code $exitCode"
          }

          if ($exitCode -eq $errorNoMoreItems) {
            Write-Host "CryptNet cache enumeration exhausted after deletion (ERROR_NO_MORE_ITEMS)."
          }

          exit 0
      - name: Tests
        run: cargo test --workspace --all-targets -- --nocapture
      - name: Negative revocation offline contract
        if: runner.os == 'Windows'
        run: cargo test -p trust-policy --test negative_revocation_contract offline_revocation_is_a_structured_blocked_release_decision -- --ignored --nocapture --test-threads=1
