name: codlisans-trust-policy

on:
  push:
    branches: ["ci/codlisans-trust-policy"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: codlisans-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Select pinned Rust
        run: rustup override set 1.98.0
      - name: Toolchain evidence
        run: rustc --version && cargo --version
      - name: Contract tests
        run: cargo test --workspace --all-targets -- --nocapture
      - name: Format check
        if: success()
        run: cargo fmt --all -- --check
      - name: Clippy
        if: success()
        run: cargo clippy --workspace --all-targets -- -D warnings

  format-snapshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codlisans-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ci/codlisans-trust-policy
      - name: Install pinned rustfmt
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Select pinned Rust
        run: rustup override set 1.98.0
      - name: Apply canonical rustfmt
        run: cargo fmt --all
      - name: Commit canonical rustfmt
        working-directory: .
        shell: bash
        run: |
          git config user.name "yaaertu-ci"
          git config user.email "actions@users.noreply.github.com"
          git add codlisans-ci/crates
          if git diff --cached --quiet; then
            echo "No rustfmt changes to commit."
          else
            git commit -m "style: apply canonical rustfmt [skip ci]"
            git push origin HEAD:ci/codlisans-trust-policy
          fi
